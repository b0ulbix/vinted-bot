<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Connexion · Vinted Bot</title>
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <div class="login">
    <form class="panel" id="f">
      <div class="logo" style="margin-bottom:6px"><img src="/favicon.svg" width="34" height="34" alt=""><span>Vinted<b>Bot</b></span></div>
      <p class="hint" style="margin-bottom:20px">Tes alertes Vinted, en direct.</p>
      <label>Mot de passe
        <input type="password" name="password" autofocus required autocomplete="current-password">
      </label>
      <button class="btn wide">Se connecter</button>
      <p id="err" class="hint" style="color:var(--err);margin:12px 0 0"></p>
    </form>
  </div>
  <script>
    f.onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = '';
      const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: f.password.value }) });
      if (r.ok) location.href = '/';
      else err.textContent = (await r.json()).error;
    };
  </script>
</body>
</html>
